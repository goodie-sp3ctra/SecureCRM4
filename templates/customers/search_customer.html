<!-- customers/templates/customers/search_customer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Search Results</h2>
        
        <form method="get" action="{% url 'search_customer' %}">
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Search by name" name="q" value="{{ query }}">
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </form>

        {% if customers %}
            <ul class="list-group">
                {% for customer in customers %}
                    <li class="list-group-item">
                        <a href="{% url 'customer-detail' customer.pk %}">{{ customer.name }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No customers found for "{{ query }}"</p>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
