{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %} Client</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="form-group">
        {{ field.label_tag }}
        {{ field }}
        {{ field.help_text }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button class="btn btn-success">Save</button>
    <a href="{% url 'customers:list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
