{% extends "base.html" %}
{% block content %}
<h2>Delete Custom Field Definition</h2>
<p>Are you sure you want to delete “{{ object.name }}”?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'customers:fielddef_list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
