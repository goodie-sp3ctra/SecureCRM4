{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="pipeline-board d-flex gap-3">
    {% for col in columns %}
    <div class="pipeline-column flex-fill">
        <div class="column-header bg-light p-2 text-center">
            {{ col.label }}
            <span class="badge bg-secondary">{{ col.jobs|length }}</span>
</div>

<!-- Buttons -->
<div class="d-flex justify-content-start mb-3 mt-4">
    <button class="btn btn-primary mr-2">New</button>
    <button class="btn btn-secondary">Open</button>
</div>

<!-- Job headings row -->
<div class="row font-weight-bold border-bottom pb-2 mb-3 text-nowrap text-center">
    <div class="col-1">Job Number:</div>
    <div class="col-2">Schedule Date:</div>
    <div class="col-2">Date Created:</div>
    <div class="col-2">Assigned To:</div>
    <div class="col-2">Client:</div>
    <div class="col-2">Suburb:</div>
    <div class="col-2">Description:</div>
    <div class="col-3">Actions:</div>
</div>

<!-- Job row example -->
<div class="row mb-3 align-items-center text-center">
    <div class="col-1">
        <input type="text" class="form-control" placeholder="Job No">
    </div>
    <div class="col-2">
        <input type="date" class="form-control">
    </div>
    <div class="col-2">
        <input type="datetime-local" class="form-control">
    </div>
    <div class="col-2">
        <select class="form-control">
            <option selected disabled>Select Person</option>
            <option>Haleen</option>
            <option>Vinesh</option>
            <option>Mike</option>
        </select>
    </div>
    <div class="col-2">
        <input type="text" class="form-control" placeholder="Client Name">
    </div>
    <div class="col-2">
        <input type="text" class="form-control" placeholder="Suburb">
    </div>
    <div class="col-2">
        <select class="form-control">
            <option selected disabled>Select Description</option>
            <option>Site Survey</option>
            <option>Delivery/Collection</option>
            <option>Remote Control</option>
        </select>
    </div>
    <div class="col-3 d-flex flex-nowrap justify-content-start">
        <button class="btn btn-info btn-sm mr-2">View Job</button>
        <button class="btn btn-success btn-sm mr-2">Close Job</button>
        <button class="btn btn-danger btn-sm mr-2">Cancel Job</button>
        <button class="btn btn-warning btn-sm">On-Hold</button>
    </div>
</div>
{% endblock %}
