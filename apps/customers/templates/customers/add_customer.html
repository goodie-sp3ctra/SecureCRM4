<!-- customers/templates/customers/add_customer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow rounded">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add New Customer</h4>
        </div>
        <div class="card-body">
            {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="first_name" class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" id="first_name" required>
                </div>
                <div class="mb-3">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" id="last_name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea name="address" class="form-control" id="address" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" required>
                    <div id="passwordHelp" class="form-text text-danger"></div>
                </div>
                <button type="submit" class="btn btn-success">Add Customer</button>
                <a href="{% url 'customer:list' %}" class="btn btn-secondary">Back to List</a>
            </form>
        </div>
    </div>
</div>

<!-- 📌 JS formatters -->
<script>
    // Phone number formatter
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', function () {
        let digits = this.value.replace(/\D/g, '');
        if (digits.startsWith('0')) {
            digits = digits.substring(1);
        }
        if (digits.length === 9) {
            this.value = `+27 ${digits.slice(0, 2)} ${digits.slice(2, 5)} ${digits.slice(5)}`;
        }
    });

    // Password strength checker
    const passwordInput = document.getElementById('password');
    const passwordHelp = document.getElementById('passwordHelp');

    passwordInput.addEventListener('input', function () {
        const password = this.value;
        const hasUpper = /[A-Z]/.test(password);
        const hasLower = /[a-z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        const hasSpecial = /[^A-Za-z0-9]/.test(password);
        const isLongEnough = password.length >= 8;

        if (hasUpper && hasLower && hasNumber && hasSpecial && isLongEnough) {
            passwordHelp.textContent = "";
            this.setCustomValidity('');
        } else {
            passwordHelp.textContent = "Password must be at least 8 characters, and include upper/lowercase letters, a number, and a special character.";
            this.setCustomValidity("Weak password");
        }
    });
</script>
</body>
</html>
