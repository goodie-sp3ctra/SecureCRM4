{% extends "base.html" %}
{% block content %}
<h2>
    {% if object %}Edit{% else %}Add{% endif %} Custom Field Definition
</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Save</button>
    <a href="{% url 'customers:fielddef_list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
