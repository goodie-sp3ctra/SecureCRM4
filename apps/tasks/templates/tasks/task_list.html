{% extends "website/base.html" %}
{% block content %}
<h2>My Tasks</h2>

<a class="btn btn-primary mb-3" href="{% url 'tasks:create' %}">+ New Task</a>

<table class="table">
    <tr>
        <th>Title</th>
        <th>Due</th>
        <th>Status</th>
        <th></th>
    </tr>
    {% for task in object_list %}
    <tr{% if task.is_overdue %} class="table-danger" {% endif %}>
        <td>{{ task.title }}</td>
        <td>{{ task.due|date:"Y-m-d H:i" }}</td>
        <td>
            {% if task.completed_at %}✅{% else %}⏳{% endif %}
        </td>
        <td>
            <a href="{% url 'tasks:update' task.pk %}">Edit</a>
        </td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-center">No tasks.</td></tr>
        {% endfor %}
</table>
{% endblock %}
