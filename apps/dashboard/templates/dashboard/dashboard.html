{# templates/dashboard.html #}
{% extends "website/base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        {% for metric in metrics %}
        <div class="col-sm-6 col-md-4 col-lg-2">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-start">
                        <h6 class="card-subtitle text-muted">{{ metric.title }}</h6>
                        <button class="btn btn-sm btn-link p-0" title="Refresh">
                            <i class="bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <h2 class="card-title display-6 mb-0">{{ metric.value }}</h2>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <canvas id="stageChart" height="100"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script id="chart-data" type="application/json">
    {"labels":["New","Open","Closed"],"values":[1,2,3]}
</script>

<!--{# 2) load Chart.js from the CDN #}-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!--{# 3) load your standalone initializer (static/js/dashboard-chart.js) #}-->
<script src="{% static 'js/dashboard-chart.js' %}"></script>
{% endblock %}
